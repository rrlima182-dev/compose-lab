<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Dia</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0;
      color: #666;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      margin-top: 10px;
      background: #fafafa;
    }

    .task.done {
      opacity: 0.55;
      text-decoration: line-through;
    }

    .task-info {
      flex: 1;
    }

    .task-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .task-meta {
      font-size: 13px;
      color: #666;
    }

    .priority {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .alta { background: #fee2e2; color: #991b1b; }
    .media { background: #fef3c7; color: #92400e; }
    .baixa { background: #dcfce7; color: #166534; }

    .actions {
      display: flex;
      gap: 6px;
    }

    .small-btn {
      width: auto;
      padding: 8px 10px;
      margin: 0;
      font-size: 13px;
    }

    .delete {
      background: #ef4444;
    }

    .delete:hover {
      background: #dc2626;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Meu Dia 👋</h1>
      <p class="subtitle">Organize suas tarefas de hoje de um jeito simples.</p>
    </section>

    <section class="card">
      <h2>Adicionar tarefa</h2>

      <label for="taskName">Tarefa</label>
      <input id="taskName" type="text" placeholder="Ex: estudar AWS" />

      <label for="taskTime">Horário</label>
      <input id="taskTime" type="time" />

      <label for="taskPriority">Prioridade</label>
      <select id="taskPriority">
        <option value="baixa">Baixa</option>
        <option value="media">Média</option>
        <option value="alta">Alta</option>
      </select>

      <button onclick="addTask()">Adicionar</button>
    </section>

    <section class="card">
      <h2>Tarefas de hoje</h2>
      <div id="taskList"></div>
    </section>
  </main>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function addTask() {
      const name = document.getElementById('taskName').value.trim();
      const time = document.getElementById('taskTime').value;
      const priority = document.getElementById('taskPriority').value;

      if (!name) {
        alert('Digite o nome da tarefa.');
        return;
      }

      const task = {
        id: Date.now(),
        name,
        time: time || 'Sem horário',
        priority,
        done: false
      };

      tasks.push(task);
      tasks.sort((a, b) => a.time.localeCompare(b.time));
      saveTasks();
      renderTasks();

      document.getElementById('taskName').value = '';
      document.getElementById('taskTime').value = '';
      document.getElementById('taskPriority').value = 'baixa';
    }

    function toggleTask(id) {
      tasks = tasks.map(task => {
        if (task.id === id) {
          return { ...task, done: !task.done };
        }
        return task;
      });
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
      renderTasks();
    }

    function renderTasks() {
      const taskList = document.getElementById('taskList');
      taskList.innerHTML = '';

      if (tasks.length === 0) {
        taskList.innerHTML = '<p class="empty">Nenhuma tarefa cadastrada ainda.</p>';
        return;
      }

      tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = `task ${task.done ? 'done' : ''}`;

        div.innerHTML = `
          <div class="task-info">
            <div class="task-title">${task.name}</div>
            <div class="task-meta">${task.time} · <span class="priority ${task.priority}">${task.priority}</span></div>
          </div>
          <div class="actions">
            <button class="small-btn" onclick="toggleTask(${task.id})">${task.done ? 'Voltar' : 'Feito'}</button>
            <button class="small-btn delete" onclick="deleteTask(${task.id})">Excluir</button>
          </div>
        `;

        taskList.appendChild(div);
      });
    }

    renderTasks();
  </script>
</body>
</html>
